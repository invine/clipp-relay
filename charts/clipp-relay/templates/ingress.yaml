{{- $v := .Values -}}
{{- $name := include "clipp.name" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-portal
spec:
  ingressClassName: {{ $v.public.ingressClass }}
  tls:
    - hosts: [{{ trimPrefix "https://" $v.public.portalOrigin | quote }}]
      secretName: {{ $v.public.portalTLSSecret }}
  rules:
    - host: {{ trimPrefix "https://" $v.public.portalOrigin | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-portal
                port: {name: http}
{{- if $v.transports.wss.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-wss
  annotations:
    nginx.org/websocket-services: {{ $name }}-wss
    nginx.org/proxy-read-timeout: "180s"
    nginx.org/proxy-send-timeout: "180s"
spec:
  ingressClassName: {{ $v.public.ingressClass }}
  tls:
    - hosts: [{{ $v.public.wssHostname | quote }}]
      secretName: {{ $v.public.wssTLSSecret }}
  rules:
    - host: {{ $v.public.wssHostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-wss
                port: {name: http}
{{- end }}
