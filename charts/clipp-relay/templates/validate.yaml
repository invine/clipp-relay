{{- $v := .Values -}}
{{- $name := include "clipp.name" . -}}
{{- if not (has $v.database.mode (list "external" "bundled")) }}{{ fail "explicit external or bundled database mode required" }}{{ end -}}
{{- if or (eq $v.database.name "") (eq $v.database.servingSecret "") (eq $v.database.migrationSecret "") (eq $v.database.caSecret "") }}{{ fail "database name and distinct credential/trust Secret references are required" }}{{ end -}}
{{- if eq $v.database.servingSecret $v.database.migrationSecret }}{{ fail "serving and migration Secrets must differ" }}{{ end -}}
{{- $b := $v.database.bundled -}}
{{- if eq $v.database.mode "external" -}}
  {{- if eq $v.database.external.host "" }}{{ fail "external database endpoint required" }}{{ end -}}
  {{- if or $b.initialize $b.storage.newClaim.enabled (ne $b.storage.existingClaim "") (ne $b.image.repository "") (ne $b.image.digest "") (ne $b.adminSecret "") (ne $b.tlsSecret "") (ne $b.clusterDomain "") (ne $b.storage.newClaim.storageClassName "") (ne $b.storage.newClaim.size "") }}{{ fail "external mode cannot configure bundled PostgreSQL" }}{{ end -}}
{{- else -}}
  {{- if ne .Release.Namespace "relay-portal-test" }}{{ fail "bundled PostgreSQL is restricted to relay-portal-test" }}{{ end -}}
  {{- if gt (len (include "clipp.name" .)) 31 }}{{ fail "bundled mode release name is too long for database and run-specific resources" }}{{ end -}}
  {{- if not (regexMatch "^[a-z][a-z0-9_]{0,62}$" $v.database.name) }}{{ fail "bundled database name must be a safe PostgreSQL identifier" }}{{ end -}}
  {{- if and (eq $v.deployment.phase "migrating") (not (regexMatch "^[a-z0-9]([-a-z0-9]{0,10}[a-z0-9])?$" $v.deployment.runId)) }}{{ fail "bundled bootstrap run ID must be a short DNS label" }}{{ end -}}
  {{- if or (ne $v.database.external.host "") (ne (int $v.database.external.port) 5432) (gt (len $v.networkPolicy.databaseCidrs) 0) }}{{ fail "bundled mode cannot configure an external endpoint or CIDRs" }}{{ end -}}
  {{- if or (eq $b.image.repository "") (not (regexMatch "^sha256:[0-9a-f]{64}$" $b.image.digest)) (eq $b.clusterDomain "") (eq $b.adminSecret "") (eq $b.tlsSecret "") }}{{ fail "bundled PostgreSQL requires pinned image, cluster domain, and existing admin/TLS Secrets" }}{{ end -}}
  {{- $secrets := list $b.adminSecret $b.tlsSecret $v.database.servingSecret $v.database.migrationSecret $v.database.caSecret $v.credentials.googleSecret $v.credentials.adminSecret $v.credentials.pepperSecret $v.credentials.journalSecret $v.public.portalTLSSecret $v.public.wssTLSSecret -}}
  {{- if ne (len $secrets) (len (uniq $secrets)) }}{{ fail "bundled PostgreSQL and application Secrets must have distinct roles" }}{{ end -}}
  {{- if eq $b.storage.newClaim.enabled (ne $b.storage.existingClaim "") }}{{ fail "choose exactly one bundled PostgreSQL claim source" }}{{ end -}}
  {{- if $b.storage.newClaim.enabled -}}
    {{- if or (eq $b.storage.newClaim.storageClassName "") (eq $b.storage.newClaim.size "") }}{{ fail "new PostgreSQL claim requires explicit StorageClass and size" }}{{ end -}}
  {{- else -}}
    {{- if or (ne $b.storage.newClaim.storageClassName "") (ne $b.storage.newClaim.size "") }}{{ fail "existing PostgreSQL claim conflicts with new-claim settings" }}{{ end -}}
  {{- end -}}
  {{- if and $b.initialize (ne $v.deployment.phase "stopped") }}{{ fail "first initialization is allowed only while relay is stopped" }}{{ end -}}
{{- end -}}
{{- if or (eq $v.image.repository "") (not (regexMatch "^sha256:[0-9a-f]{64}$" $v.image.digest)) }}{{ fail "immutable relay image repository and sha256 digest required" }}{{ end -}}
{{- if ne (int $v.deployment.expectedSchema) 10 }}{{ fail "chart requires application schema revision 10" }}{{ end -}}
{{- if and (eq $v.deployment.phase "migrating") (eq $v.deployment.runId "") }}{{ fail "migration phase requires a run ID" }}{{ end -}}
{{- if and (ne $v.deployment.phase "migrating") (ne $v.deployment.runId "") }}{{ fail "run ID only valid in migrating phase" }}{{ end -}}
{{- $portalHost := trimPrefix "https://" $v.public.portalOrigin -}}
{{- if or (eq $portalHost $v.public.wssHostname) (contains ":" $portalHost) (eq $v.public.wssHostname "") }}{{ fail "portal and WSS require distinct exact DNS hostnames" }}{{ end -}}
{{- if or (eq $v.public.portalTLSSecret "") (eq $v.public.wssTLSSecret "") (eq $v.public.ingressClass "") }}{{ fail "distinct TLS Secret names and F5 ingress class required" }}{{ end -}}
{{- if and $v.certificates.enabled (eq $v.certificates.clusterIssuer "") }}{{ fail "certificates.clusterIssuer required when certificates are enabled" }}{{ end -}}
{{- if and $v.certificates.enabled $v.transports.wss.enabled (eq $v.public.portalTLSSecret $v.public.wssTLSSecret) }}{{ fail "managed portal and WSS Certificates require distinct TLS Secret names" }}{{ end -}}
{{- $ports := list $v.listeners.portalPort $v.listeners.privatePort $v.listeners.tcpPort $v.listeners.wssPort $v.listeners.udpPort -}}
{{- $seen := dict -}}
{{- range $ports }}{{ $key := printf "%d" (int .) }}{{ if hasKey $seen $key }}{{ fail "listener ports must be distinct" }}{{ end }}{{ $_ := set $seen $key true }}{{ end -}}
{{- range $ports }}{{ if lt (int .) 1024 }}{{ fail "listener ports must be unprivileged" }}{{ end }}{{ end -}}
{{- if and (not $v.transports.tcp.enabled) (not $v.transports.wss.enabled) (not $v.transports.udp.enabled) }}{{ fail "at least one transport required" }}{{ end -}}
{{- if and $v.transports.tcp.enabled (eq (len $v.transports.tcp.addresses) 0) (eq (int $v.transports.tcp.publicPort) 0) }}{{ fail "watched TCP transport needs public port" }}{{ end -}}
{{- if and $v.transports.udp.enabled (eq (len $v.transports.udp.addresses) 0) (eq (int $v.transports.udp.publicPort) 0) }}{{ fail "watched UDP transport needs public port" }}{{ end -}}
{{- if and $v.transports.wss.enabled (eq (len $v.transports.wss.addresses) 0) }}{{ fail "WSS requires explicit exact-host public address" }}{{ end -}}
{{- if or (and (not $v.transports.tcp.enabled) (gt (len $v.transports.tcp.addresses) 0)) (and (not $v.transports.udp.enabled) (gt (len $v.transports.udp.addresses) 0)) (and (not $v.transports.wss.enabled) (gt (len $v.transports.wss.addresses) 0)) }}{{ fail "disabled transport cannot publish addresses" }}{{ end -}}
{{- range $v.transports.wss.addresses }}{{ if not (hasPrefix (printf "/dns4/%s/" $v.public.wssHostname) .) }}{{ fail "WSS public address must use exact configured host" }}{{ end }}{{ end -}}
{{- if or (eq $v.credentials.googleSecret "") (eq $v.credentials.adminSecret "") (eq $v.credentials.pepperSecret "") (eq $v.credentials.journalSecret "") }}{{ fail "versioned serving Secret references required" }}{{ end -}}
{{- if or (eq $v.journal.region "") (eq $v.journal.namespace "") (eq $v.journal.bucket "") (eq $v.journal.repositoryId "") (eq $v.journal.coverageHash "") (eq $v.journal.tenancyOcid "") (eq $v.journal.userOcid "") (eq $v.journal.fingerprint "") }}{{ fail "attested journal configuration required" }}{{ end -}}
{{- if and (or $v.transports.tcp.enabled $v.transports.udp.enabled) (or (eq $v.oci.subnetOcid "") (eq $v.oci.frontendNsgOcid "") (eq $v.oci.backendNsgOcid "")) }}{{ fail "existing OCI subnet and frontend/backend NSG inputs required" }}{{ end -}}
{{- $watch := or (eq (include "clipp.watchTCP" .) "true") (eq (include "clipp.watchUDP" .) "true") -}}
{{- if or
  (and (or $v.transports.tcp.enabled $v.transports.udp.enabled) (eq (len $v.networkPolicy.publicCidrs) 0))
  (eq (len $v.networkPolicy.operationsCidrs) 0)
  (and (eq $v.database.mode "external") (eq (len $v.networkPolicy.databaseCidrs) 0))
  (and $watch (eq (len $v.networkPolicy.apiCidrs) 0))
  (eq (len $v.networkPolicy.httpsCidrs) 0)
  (eq (len $v.networkPolicy.ingressNamespaceSelector) 0)
  (eq (len $v.networkPolicy.ingressPodSelector) 0)
  (eq (len $v.networkPolicy.dnsNamespaceSelector) 0)
  (eq (len $v.networkPolicy.dnsPodSelector) 0)
}}{{ fail "enforcing NetworkPolicy source and destination inputs required" }}{{ end -}}
